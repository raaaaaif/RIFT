name: Web build and contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check workload, verdict, receipt, and replay boundaries
        run: python -m unittest tests.test_contracts tests.test_browser
      - name: Install locked UI dependencies
        run: npm --prefix ui ci
      - name: Typecheck and build shipped browser experience
        run: npm --prefix ui run build
